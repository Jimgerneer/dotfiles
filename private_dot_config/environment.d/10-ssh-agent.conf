# Read by the systemd USER manager at startup, so everything it launches
# inherits this: user services, and Hyprland itself (uwsm starts it as a
# systemd unit). That is what lets clip-push-mac.service and the
# super+shift+V bind reach the same agent your shells use.
#
# Must match ExecStart in ssh-agent.service.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
