# Per-device ALSA tuning. MACHINE-SPECIFIC to `tinos` -- names the Xonar
# Essence STX and the RODE AI-1. Guard this per-hostname in chezmoi (Phase 3);
# the laptop has neither device.
#
# NOTE: no `device.profile-set` pin here. An earlier draft pinned the Xonar to
# analog-only.conf so ACP could never claim hw:STX,1. Dropped 2026-08-23 after
# measurement: hw:STX,1 is already free, and the analog duplex profile is the
# highest priority on this card (6565 vs 5555/5565 for the IEC958 profiles), so
# WirePlumber always selects it. analog-only.conf would also have changed the
# port IDs (analog-output-headphones vs output-headphones-1) and the device
# string (front:%f), breaking the headphone-port fix that already works.
#
# See: ~/Documents/arch-rebuild/phase-1-audio.md, Steps 3-5.

monitor.alsa.rules = [

  # --- Xonar Essence STX, analog path (AKG K712 via TPA6120) ---------------
  { matches = [ { node.name = "~alsa_output.pci-0000_25_04.0.*" } ]
    actions = { update-props = {
        audio.format = "S32LE"          # card offers S16_LE / S32_LE only
        audio.rate   = 48000
        api.alsa.period-size = 256
        api.alsa.headroom    = 1024     # ASM1083 PCIe-to-PCI bridge insurance
        api.alsa.disable-batch = true
        session.suspend-timeout-seconds = 0
        node.description = "AKG K712 (Xonar Analog)"
    } } }

  # --- RODE AI-1 capture (the microphone) ---------------------------------
  # Genuinely 1-channel: /proc/asound/card1/stream0 reports MONO. Do not
  # "fix" this to stereo -- that duplicates one mic into two channels and
  # doubles the DSP cost for nothing. If a game refuses to see a mono source,
  # make the FILTER CHAIN output stereo instead.
  { matches = [ { node.name = "~alsa_input.usb-RODE_Microphones.*" } ]
    actions = { update-props = {
        audio.format   = "S24_3LE"      # the ONLY format this device offers
        audio.rate     = 48000
        audio.channels = 1
        audio.position = [ MONO ]
        api.alsa.period-size = 256
        api.alsa.headroom    = 2048     # full-speed USB: be generous
        session.suspend-timeout-seconds = 0
        node.description = "RODE AI-1 (raw - use Mic (Processed) instead)"
    } } }

  # --- RODE AI-1 playback: deprioritise, do not use as a desktop sink ------
  # Its headphone jack is empty; the K712 lives on the Xonar. Playing back
  # through the interface you record from is how echo paths get created, and
  # it puts the whole desktop behind a 12 Mbit/s full-speed USB link.
  { matches = [ { node.name = "~alsa_output.usb-RODE_Microphones.*" } ]
    actions = { update-props = {
        priority.driver  = 100
        priority.session = 100
        node.description = "RODE AI-1 output (unused)"
    } } }

  # --- Onboard ALC1220 and HDMI audio: keep out of the way -----------------
  # Nothing is plugged into either. Low priority so they never win a default.
  { matches = [ { node.name = "~alsa_output.pci-0000_34_00.4.*" }
                { node.name = "~alsa_output.pci-0000_32_00.1.*" } ]
    actions = { update-props = {
        priority.driver  = 50
        priority.session = 50
    } } }
]
