# Bluetooth policy.
#
# ============================================================================
# THE POLICY: Bluetooth is for OUTPUT ONLY. Never the microphone.
#
# You own a RØDE NT1 on a real preamp. Any Bluetooth headset microphone is
# dramatically worse -- but the real problem is not the mic quality, it is what
# using it does to everything else:
#
#   The moment an application opens a Bluetooth headset's microphone, the
#   device drops from A2DP to HFP, and the PLAYBACK quality collapses at the
#   same instant -- from ~330 kbps stereo to 8-16 kHz mono telephony.
#
# That is a Bluetooth protocol limitation, not a Linux bug: the headset cannot
# do high-quality playback and microphone simultaneously. Windows and macOS
# behave identically. The usual experience is "my music turned to mud the
# second I joined a call".
#
# `bluetooth.autoswitch-to-headset-profile = false` is the whole ballgame.
# Restricting `bluez5.roles` is the belt-and-braces backup: with HFP/HSP roles
# absent, the headset mic is never even offered, so nothing can trigger the
# switch.
# ============================================================================
#
# ⚠️ NOT YET TESTED WITH A REAL DEVICE -- 2026-08-24. No Bluetooth audio
# hardware was available. What HAS been verified:
#   - the adapter exists (hci0) with btusb/btintel loaded (Intel AX200)
#   - every setting and property name below exists in the installed binaries
#     (WirePlumber 0.5.15 `wpctl settings`, and strings on libspa-bluez5.so)
# What has NOT been verified: pairing, codec negotiation, actual audio, and
# whether autoswitch is genuinely suppressed in practice.
#
# 🔴 `bluez5.codecs` DOES NOT EXIST in PipeWire 1.6.8 and is deliberately
# absent below. An earlier draft of phase-1-audio.md listed it; it would have
# been silently ignored. Confirmed by grepping the SPA plugins -- the property
# appears nowhere. All 14 codec plugins ARE installed (LDAC, AAC, aptX/HD/LL,
# LC3, Opus, SBC-XQ, ...); codec choice is now made per-device at runtime, in
# `pavucontrol`'s codec dropdown or via the device's card profile.
#
# See: ~/Documents/arch-rebuild/phase-1-audio.md, Step 8.

wireplumber.settings = {
  # THE important one. Default is `true`, which is what causes the collapse.
  bluetooth.autoswitch-to-headset-profile = false

  # Prefer audio quality over latency when auto-selecting a profile.
  # Only "quality" or "latency" are accepted.
  bluetooth.profile-preference = "quality"

  # Remember per-device headset-mode state across reconnects.
  bluetooth.use-persistent-storage = true

  # If Bluetooth headphones disconnect (walk out of range, battery dies),
  # mute rather than abruptly dumping the audio onto the desk speakers.
  device.routes.mute-on-bluetooth-playback-removed = true
}

monitor.bluez.properties = {
  # A2DP only. With no hfp_*/hsp_* role, the headset microphone is never
  # offered and therefore can never trigger the profile switch.
  #   a2dp_sink   -- we send audio TO headphones/speakers   <- the useful one
  #   a2dp_source -- we receive audio FROM a phone
  # Valid values, read from libspa-bluez5.so: a2dp_sink a2dp_source hfp_ag
  # hfp_hf hsp_ag hsp_hs bap_sink bap_source asha_sink
  bluez5.roles = [ a2dp_sink a2dp_source ]

  # SBC-XQ: higher-bitrate SBC. Better than stock SBC on devices that lack
  # AAC/aptX/LDAC, and widely compatible.
  bluez5.enable-sbc-xq = true

  # Let the device's own volume buttons drive PipeWire's volume.
  bluez5.enable-hw-volume = true

  # mSBC is a WIDEBAND HFP codec. Enabled so that IF the HFP restriction above
  # is ever relaxed, headset calls are at least wideband rather than 8 kHz.
  # Harmless while `bluez5.roles` excludes HFP.
  bluez5.enable-msbc = true
}
