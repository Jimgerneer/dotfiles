# Idle behaviour.
#
# ⚠️ NOTE ON "DIM": the chosen policy was dim-at-5min. There is no dim step here
# because this is a desktop monitor on DisplayPort — there is no backlight
# interface for the compositor to turn down. (Laptops expose one via
# /sys/class/backlight; a G9 does not.) Screen-OFF at 60 min replaces it (raised from 15 on 2026-08-28:
# the hyprlock clock is wanted as an ambient display, and a VA panel has no
# OLED burn-in mechanism to argue against it).
#
# ⚠️ DDC/CI: ruled out by measurement 2026-08-28. ddcutil finds the right bus
# (/dev/i2c-8, card1-DP-2) and reads EDID fine at slave 0x50, but 0x37 is
# unresponsive: "This monitor does not support DDC/CI." Retried with
# --sleep-multiplier 4 and --force-slave-address; both EREMOTEIO. The panel
# has NO brightness control over any interface. Do not reopen this.
#
# ⚠️ NOTE ON SUSPEND: idleness is measured on INPUT, not CPU. A long render with
# nobody at the keyboard looks idle. hyprland.conf carries
# `windowrule = idleinhibit always, class:^(resolve)$` to cover exactly that.
# If you add another long-running tool, give it the same rule or it WILL be
# suspended mid-job.

# ⚠️ NOTE ON hyprctl UNDER A LUA CONFIG: `hyprctl dispatch` evaluates its
# argument AS LUA, so the classic string form is dead. Measured 2026-08-26 on
# Hyprland 0.56.2:
#     $ hyprctl dispatch dpms on
#     error: [string "return hl.dispatch(dpms on)"]:1: ')' expected near 'on'
# Every dpms line below used that form and had been silently failing since the
# Lua migration -- the screen never blanked on idle, and after_sleep_cmd (the
# line that exists SO THE PANEL WAKES AFTER SUSPEND) did nothing either.
# The working form is hl.dsp.dpms("on") / hl.dsp.dpms("off").

general {
    lock_cmd = pidof hyprlock || hyprlock       # never stack two lockers
    before_sleep_cmd = loginctl lock-session    # lock BEFORE sleeping, so the
                                                # machine can never resume unlocked
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'   # some panels stay dark otherwise
}

listener {
    timeout = 600                               # 10 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 3600                              # 60 min — screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 5400                              # 90 min
    on-timeout = systemctl suspend
}
