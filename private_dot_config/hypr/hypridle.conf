# Idle behaviour.
#
# ⚠️ NOTE ON "DIM": the chosen policy was dim-at-5min. There is no dim step here
# because this is a desktop monitor on DisplayPort — there is no backlight
# interface for the compositor to turn down. (Laptops expose one via
# /sys/class/backlight; a G9 does not.) Screen-OFF at 15 min replaces it.
#
# ⚠️ NOTE ON SUSPEND: idleness is measured on INPUT, not CPU. A long render with
# nobody at the keyboard looks idle. hyprland.conf carries
# `windowrule = idleinhibit always, class:^(resolve)$` to cover exactly that.
# If you add another long-running tool, give it the same rule or it WILL be
# suspended mid-job.

general {
    lock_cmd = pidof hyprlock || hyprlock       # never stack two lockers
    before_sleep_cmd = loginctl lock-session    # lock BEFORE sleeping, so the
                                                # machine can never resume unlocked
    after_sleep_cmd = hyprctl dispatch dpms on  # some panels stay dark otherwise
}

listener {
    timeout = 600                               # 10 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900                               # 15 min — screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

listener {
    timeout = 1800                              # 30 min
    on-timeout = systemctl suspend
}
