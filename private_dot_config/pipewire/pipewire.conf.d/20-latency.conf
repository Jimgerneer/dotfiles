# Graph clock and quantum.
#
# 512 / 48000 = 10.7 ms. One step tighter than the 1024 stock default, and a
# safe daily driver.
#
# WHY 48000: Resolve, YouTube, games, Discord and the VM are all 48 kHz.
# Spotify at 44.1 is the only common exception, and 10-rates.conf lets the
# graph switch clock when every node is idle so 44.1 can still play bit-exact.
# In practice, with anything idling on a sink the graph stays at 48 kHz and
# Spotify gets resampled. That is fine -- do not fight it.
#
# WHY NOT SMALLER: quantum only affects desktop latency. 512 is imperceptible
# for games, video scrub and voice chat. The one case that genuinely benefits
# is software mic monitoring (see 65-mic-monitor.conf) -- drop to 256 if you
# end up monitoring a lot. Do NOT go below 256 while the RODE AI-1 is in the
# graph: it is full-speed USB with 1 ms frames and will xrun.
#
# See: ~/Documents/arch-rebuild/phase-1-audio.md, Step 5.

context.properties = {
    default.clock.rate          = 48000
    default.clock.quantum       = 512
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
    default.clock.quantum-limit = 8192
}
