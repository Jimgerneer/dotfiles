# Microphone processing chain -- RODE NT1 via RODE AI-1.
#
# Produces a virtual source "Mic (Processed)" (node name: mic_processed) which
# becomes the system default. Discord, TeamSpeak, browsers, native games and
# Proton games all pick it up with no per-app configuration, because they all
# resolve the default source through pipewire-pulse / pipewire-alsa.
#
# ============================================================================
# TUNED TO MEASUREMENTS TAKEN 2026-08-23, NOT TO DEFAULTS
#
#   speech peaks     -7.1 to -14.8 dBFS
#   speech RMS      -24.8 to -30.3 dBFS
#   noise floor RMS         ~ -60   dBFS
#   noise floor peak  -41.9 to -53  dBFS
#   signal-to-noise         ~  33   dB     (excellent -- NT1 self-noise 4.5 dBA)
#
# Re-measure with `mic-level -c` and `mic-level -n` if the mic, its position,
# the AI-1's gain knob, or the room changes. Every threshold below is derived
# from those numbers.
# ============================================================================
#
# SIGNAL PATH
#   highpass 90Hz -> RNNoise -> gate -> lowshelf -> peaking
#           -> compressor -> de-esser -> limiter -> "Mic (Processed)"
#
# All identifiers here were read from the installed binaries, never from a
# guide -- see phase-1-audio.md Step 6 for how, and why it matters.
#   builtin  : single-port filters use "In"/"Out"; biquads take Freq/Q/Gain
#              noisegate thresholds are in dB -- LSP gains are linear. The
#              units are NOT consistent between them. Measure, do not assume.
#   ladspa   : label `noise_suppressor_mono`, ports "Input"/"Output"
#   lv2      : LSP audio ports are "in"/"out"; gains are LINEAR, not dB
#
# LINEAR <-> dB:  linear = 10^(dB/20)
#   -1 dB = 0.891   -6 dB = 0.501   -12 dB = 0.251
#  -20 dB = 0.100  -35 dB = 0.0178  -40 dB = 0.0100
#   +8 dB = 2.512

context.modules = [
  { name = libpipewire-module-filter-chain
    # nofail: a broken chain must not leave the desktop with no microphone.
    flags = [ nofail ]
    args = {
      node.description = "Mic (Processed)"
      media.name       = "Mic (Processed)"

      filter.graph = {
        nodes = [

          # --- 1. High-pass, 90 Hz -----------------------------------------
          # NOTE: an earlier version had a `dcblock` stage in front of this.
          # Removed 2026-08-23. It failed to load -- "unknown output port
          # dc:Out", because dcblock is a multi-channel filter using
          # "In 1"/"Out 1" rather than "In"/"Out" -- and it was redundant
          # anyway: a 2nd-order high-pass at 90 Hz attenuates DC (0 Hz)
          # completely. One stage fewer for the same result.
          # The NT1 is a large-diaphragm CARDIOID: close-miked it has strong
          # proximity effect, piling up energy below the voice fundamental.
          # 90 Hz is below a male fundamental (~85-180 Hz) so it removes rumble,
          # HVAC and desk thumps without thinning the voice.
          # Raise toward 100-110 Hz if it still sounds boomy; lower to 70 if thin.
          { type = builtin  name = hpf  label = bq_highpass
            control = { "Freq" = 90.0  "Q" = 0.707 } }

          # --- 3. RNNoise ---------------------------------------------------
          # Neural noise suppression. Runs BEFORE the gate so the gate sees an
          # already-clean floor, which widens its margin.
          #
          # LADSPA build deliberately: the LV2 build exposes vad_threshold as an
          # lv2:Parameter (patch-style), which PipeWire's filter-chain cannot set.
          #
          # VAD Threshold 50% is a deliberately conservative start. Raise toward
          # 85-95 for more aggressive suppression, but too high clips quiet word
          # onsets -- which sounds far worse than a little residual noise.
          # With a 33 dB SNR you do not need it working hard.
          { type = ladspa  name = rnn
            plugin = "/usr/lib/ladspa/librnnoise_ladspa.so"
            label  = "noise_suppressor_mono"
            control = {
              "VAD Threshold (%)"          = 50.0
              "VAD Grace Period (ms)"      = 200.0
              "Retroactive VAD Grace (ms)" = 0.0
              "Dry Mix"                    = 0.0
            } }

          # --- 4. Noise gate ------------------------------------------------
          # 🔴 THRESHOLDS ARE IN dB, NOT LINEAR GAIN. Established by measurement
          # 2026-08-23, and it matters enormously:
          #     "Open Threshold" = 0.0178  (linear for -35 dB)  -> chain output
          #        was -91 dB FLAT, speech included. 0.0178 dB is essentially
          #        full scale, so the gate could never open. Completely silent
          #        microphone, no error logged anywhere.
          #     "Open Threshold" = -35.0   (dB)                 -> works.
          # PipeWire's docs call these a "volume threshold", which reads as
          # linear; the other builtin gains here (LSP mk/al/th) genuinely ARE
          # linear. Do not assume consistency -- measure.
          #
          # Derived from the measured floor:
          #   Open  -35 dB -- ~7 dB above the worst noise peak (-41.9), so the
          #                   room can never open the gate
          #   Close -40 dB -- hysteresis. The 5 dB gap stops it chattering on
          #                   trailing consonants.
          # Attack 5 ms is fast enough not to clip word onsets. Hold 200 ms keeps
          # it open through short pauses inside a sentence.
          #
          # If your voice gets chopped: LOWER Open Threshold (e.g. -40).
          # If the room comes through: RAISE it. Keep Close ~5 dB below Open.
          { type = builtin  name = gate  label = noisegate
            control = {
              "Open Threshold"  = -35.0
              "Close Threshold" = -40.0
              "Attack (s)"      = 0.005
              "Release (s)"     = 0.15
              "Hold (s)"        = 0.2
            } }

          # --- 5 & 6. EQ, subtractive ---------------------------------------
          # Deliberately gentle. EQ is the stage that MUST be tuned by ear, and
          # over-EQing to a stranger's numbers is worse than not EQing at all.
          # The peaking band starts at 0 dB (i.e. inactive) on purpose.
          #
          #   lowshelf 200 Hz  -2 dB : trims residual proximity warmth
          #   peaking  350 Hz   0 dB : boxiness/mud lives here. Try -2 to -4
          #                            if you sound like you are in a carton.
          { type = builtin  name = shelf  label = bq_lowshelf
            control = { "Freq" = 200.0  "Q" = 0.707  "Gain" = -2.0 } }

          { type = builtin  name = mud    label = bq_peaking
            control = { "Freq" = 350.0  "Q" = 1.2    "Gain" = 0.0 } }

          # --- 7. Compressor -------------------------------------------------
          # LSP gains are LINEAR.
          #   al 0.100 = -20 dB threshold. Your normal speech RMS (-27) sits
          #              BELOW this, so ordinary speech is untouched and only
          #              peaks get caught -- which is what keeps it natural.
          #   cr 3.0   : a -7 dBFS peak is 13 dB over, so leaves at -15.7
          #              => ~7 dB gain reduction at your loudest. Target is 4-6
          #              dB on normal delivery; consistently over 8 means the
          #              AI-1's gain is too low, not that the ratio is wrong.
          #   mk 2.512 = +8 dB makeup, putting output RMS near -19 and peaks
          #              near -8, comfortably under the limiter.
          #   at 10 ms : fast enough for plosives, slow enough to keep transients
          #   rt 150 ms: avoids audible pumping between words
          { type = lv2  name = comp
            plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
            control = {
              "al" = 0.100      # attack threshold, -20 dB
              "cr" = 3.0        # ratio
              "at" = 10.0       # attack, ms
              "rt" = 150.0      # release, ms
              "kn" = 0.501      # knee, -6 dB soft
              "mk" = 2.512      # makeup, +8 dB
            } }

          # --- 8. De-esser ----------------------------------------------------
          # A de-esser IS a compressor whose sidechain is band-limited to the
          # sibilance range: it ducks the whole signal, but only when there is
          # energy around "s"/"sh"/"t". No dedicated de-esser plugin is needed,
          # and none exists in lsp-plugins.
          #
          # `compressor_mono` (stage 7) CANNOT do this -- it has sidechain type,
          # mode and preamp but no sidechain FILTER. `sc_compressor_mono` adds
          # shpf/slpf, which is the entire difference.
          #
          #   sct 0  = Feed-forward -- sidechain taken from this plugin's own
          #            input. The DEFAULT IS 2 (External), which would listen to
          #            an unconnected port and never trigger, so this must be
          #            set explicitly.
          #   scm 0  = Peak detection. Sibilants are transients; RMS is too slow.
          #   shpf/slpf 5-9 kHz = the sibilance band for most voices. Move the
          #            window down toward 4.5 kHz for a deeper voice, up toward
          #            10 kHz if it sounds lispy (over-de-essed).
          #   at 1 ms / rt 40 ms -- must catch the "s" and release before the
          #            next syllable, otherwise it ducks whole words.
          #   mk 1.0 = NO makeup gain. A de-esser only ever removes.
          #
          # Placed AFTER the compressor deliberately: compression raises
          # sibilance along with everything else, so de-essing first would leave
          # the compressor to undo the work.
          #
          # 🎧 TUNING: set "scl" = 1 to AUDITION THE SIDECHAIN -- you then hear
          # only what the detector hears. Adjust shpf/slpf until you hear your
          # esses and little else, then set scl back to 0 and lower "al" until
          # the harshness goes but you can still hear the consonant. Over-
          # de-essing produces a lisp and is worse than the sibilance was.
          { type = lv2  name = deess
            plugin = "http://lsp-plug.in/plugins/lv2/sc_compressor_mono"
            control = {
              "sct"  = 0        # Feed-forward -- internal sidechain
              "scm"  = 0        # Peak detection
              "shpf" = 5000.0   # sidechain band-pass, low edge  (Hz)
              "slpf" = 9000.0   # sidechain band-pass, high edge (Hz)
              "al"   = 0.0316   # threshold, -30 dB -- lowered from -24 dB
                                #   2026-08-24: esses still harsh at -24
              "cr"   = 4.0      # ratio
              "at"   = 1.0      # attack, ms -- fast, to catch the transient
              "rt"   = 40.0     # release, ms
              "kn"   = 0.501    # knee, -6 dB soft
              "mk"   = 1.0      # NO makeup -- a de-esser only removes
              "scl"  = 0        # 1 = audition the sidechain (see TUNING above)
            } }

          # --- 9. Limiter -----------------------------------------------------
          # Brickwall safety net, not a sound-shaping stage. It should barely
          # ever engage; if it works hard, lower the compressor makeup instead.
          #   th 0.891 = -1 dBFS ceiling
          { type = lv2  name = limit
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_mono"
            control = {
              "th" = 0.891      # threshold, -1 dB
              "lk" = 5.0        # lookahead, ms
            } }
        ]

        links = [
          { output = "hpf:Out"     input = "rnn:Input" }
          { output = "rnn:Output"  input = "gate:In"   }
          { output = "gate:Out"    input = "shelf:In"  }
          { output = "shelf:Out"   input = "mud:In"    }
          { output = "mud:Out"     input = "comp:in"   }
          { output = "comp:out"    input = "deess:in"  }
          # The sidechain input is also fed from the same point. With sct=0
          # (feed-forward) the plugin uses its own input internally, but the
          # `sc` audio port still exists and is connected so the graph has no
          # dangling input.
          { output = "comp:out"    input = "deess:sc"  }
          { output = "deess:out"   input = "limit:in"  }
        ]

        inputs  = [ "hpf:In"    ]
        outputs = [ "limit:out" ]
      }

      capture.props = {
        node.name     = "capture.mic_processed"
        node.passive  = true
        # Pin to the AI-1 so the chain cannot latch onto the wrong capture
        # device after a USB re-enumeration.
        target.object = "alsa_input.usb-RODE_Microphones_RODE_AI-1_31F091A4-00.mono-fallback"
        audio.channels = 1
        audio.position = [ MONO ]
      }

      playback.props = {
        node.name        = "mic_processed"
        node.description = "Mic (Processed)"
        media.class      = "Audio/Source"
        audio.channels   = 1
        audio.position   = [ MONO ]
        # Outrank the raw AI-1 capture so WirePlumber re-picks this as default
        # after a reboot or USB re-enumeration, without manual intervention.
        priority.session = 2500
        priority.driver  = 2500
      }
    }
  }
]
