# Xonar Essence STX S/PDIF output as a standing PipeWire sink.
#
# WHY THIS FILE EXISTS
# The Xonar has two independent PCMs on separate DMA channels:
#   hw:STX,0  "Multichannel"  -> DAC -> TPA6120 -> 6.35mm jack -> AKG K712
#   hw:STX,1  "Digital"       -> S/PDIF -> mini-TOSLINK -> desk speakers
# Both are stereo, S16_LE/S32_LE, 32-192 kHz, and can run simultaneously.
#
# ACP (the card-profile system) will not expose analog and IEC958 sinks in the
# same profile -- its stock profiles pair one output with one input. Rather than
# script profile switching (which destroys and recreates the sink, upsetting
# Electron apps and games) or use the pro-audio profile (which is documented to
# break Firefox/Chromium/Electron/games), we let ACP own the analog path and
# attach the S/PDIF PCM here as an independent node.
#
# NO CONTENTION: ACP only opens PCMs belonging to the active profile, and the
# highest-priority profile on this card is output:analog-stereo+input:analog-stereo
# (6565) which contains only hw:STX,0. Verified 2026-08-23: hw:STX,1 opened
# successfully while WirePlumber held hw:STX,0.
#
# Note "hw:STX,1" uses the ALSA card *id*, not a number -- card numbers shuffle
# across boots, ids do not.
#
# See: ~/Documents/arch-rebuild/phase-1-audio.md, Step 4.

context.objects = [
  { factory = adapter
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = "alsa_output.xonar_spdif"
      node.description = "Desk Speakers (Xonar S/PDIF)"
      media.class      = "Audio/Sink"
      api.alsa.path    = "hw:STX,1"

      audio.format     = "S32LE"      # card offers S16_LE / S32_LE only
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [ FL FR ]

      api.alsa.period-size = 1024
      api.alsa.headroom    = 1024     # ASM1083 PCIe-to-PCI bridge insurance

      # Stop WirePlumber closing the device when idle. Without this you get a
      # relay click and a missing first half-second every time audio starts.
      session.suspend-timeout-seconds = 0

      # Make this a plausible default so wpctl/pactl can select it, but keep it
      # below the analog sink so nothing lands here by accident.
      priority.driver  = 900
      priority.session = 900
    }
  }
]
