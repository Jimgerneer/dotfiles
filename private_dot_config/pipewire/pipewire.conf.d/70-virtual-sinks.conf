# Four virtual sinks for per-application routing and isolated recording stems.
#
#   Game   Chat   Music   VM
#
# ============================================================================
# WHY LOOPBACKS, NOT NULL SINKS
#
# A null sink goes nowhere. You could capture its monitor, but you would never
# HEAR what you sent to it -- useless for anything except silent capture.
#
# A loopback gives you a sink that is BOTH audible and independently
# capturable: audio in -> loopback -> current output, while the sink's
# `.monitor` source carries the same audio for OBS.
#
# THE KEY TRICK: `target.object` is deliberately UNSET in playback.props, and
# `node.passive = true`. Both together mean each loopback follows whatever the
# DEFAULT SINK currently is. So `audio-out toggle` moves all four to the
# headphones or the speakers at once, with zero reconfiguration. Hardcoding a
# target here would break that and is the most common way this setup goes wrong.
#
# `node.passive = true` also stops these virtual sinks keeping the real output
# device awake when nothing is actually playing through them.
# ============================================================================
#
# COMING FROM VOICEMEETER
#   These are the equivalent of Voicemeeter's Virtual Inputs (VAIO / AUX).
#   The difference: you do NOT need to route one to a "B" bus to record it.
#   EVERY sink in PipeWire already has a `.monitor` source, for free:
#       pactl list short sources | grep monitor
#   So OBS captures `vsink_game.monitor` for game audio alone, and add
#   `vsink_chat.monitor` as a second track for a separate voice stem.
#   No bus matrix, no checkboxes -- it is a graph, and `qpwgraph` shows it.
#
# EACH SINK HAS ITS OWN VOLUME. That is the other half of the point: game
# volume independent of chat volume, adjustable live in `wiremix` (super+v)
# or `pavucontrol`, without touching either application's own settings.
#
# See: ~/Documents/arch-rebuild/phase-1-audio.md, Step 7.

context.modules = [

  # --- Game -----------------------------------------------------------------
  { name = libpipewire-module-loopback
    flags = [ nofail ]
    args = {
      node.description = "Game"
      capture.props = {
        node.name        = "vsink_game"
        node.description = "Game"
        media.class      = Audio/Sink
        audio.position   = [ FL FR ]
      }
      playback.props = {
        node.name      = "vsink_game_out"
        node.passive   = true      # follow the default sink; do NOT set target.object
        audio.position = [ FL FR ]
      }
    }
  }

  # --- Chat -----------------------------------------------------------------
  # Discord / TeamSpeak output. Keeping this separate from Game is what lets
  # OBS record voice as its own track, and lets you duck chat without ducking
  # the game.
  { name = libpipewire-module-loopback
    flags = [ nofail ]
    args = {
      node.description = "Chat"
      capture.props = {
        node.name        = "vsink_chat"
        node.description = "Chat"
        media.class      = Audio/Sink
        audio.position   = [ FL FR ]
      }
      playback.props = {
        node.name      = "vsink_chat_out"
        node.passive   = true
        audio.position = [ FL FR ]
      }
    }
  }

  # --- Music ----------------------------------------------------------------
  # Spotify / browser media. Usually the thing you want EXCLUDED from a
  # recording, for copyright reasons if nothing else -- which is exactly why it
  # gets its own sink rather than sharing with Game.
  { name = libpipewire-module-loopback
    flags = [ nofail ]
    args = {
      node.description = "Music"
      capture.props = {
        node.name        = "vsink_music"
        node.description = "Music"
        media.class      = Audio/Sink
        audio.position   = [ FL FR ]
      }
      playback.props = {
        node.name      = "vsink_music_out"
        node.passive   = true
        audio.position = [ FL FR ]
      }
    }
  }

  # --- VM -------------------------------------------------------------------
  # QEMU/libvirt guest audio. Separate so a guest cannot interfere with host
  # levels, and so guest audio can be recorded or muted independently.
  # QEMU's pipewire audiodev can be pointed straight at "vsink_vm".
  { name = libpipewire-module-loopback
    flags = [ nofail ]
    args = {
      node.description = "VM"
      capture.props = {
        node.name        = "vsink_vm"
        node.description = "VM"
        media.class      = Audio/Sink
        audio.position   = [ FL FR ]
      }
      playback.props = {
        node.name      = "vsink_vm_out"
        node.passive   = true
        audio.position = [ FL FR ]
      }
    }
  }
]
