# Package manifests, consumed by run_onchange_before_10-packages.sh.tmpl.
#
# chezmoi loads every file in .chezmoidata/ into template data, so these arrive
# as .packages.arch.pacman and friends.
#
# ⚠️ EXPLICIT packages only (pacman -Qqen / -Qqem). Dependencies are deliberately
# absent: pacman resolves those itself, and listing them would make this file
# churn on every upgrade until nobody reads the diff any more.
#
# Regenerate:
#   pacman -Qqen                                    -> arch.pacman
#   pacman -Qqem                                    -> arch.aur
#   brew bundle dump --file=- --force               -> darwin.*
#
# This is a snapshot, not a lockfile. No versions are pinned, which is the right
# trade for a desktop but does mean it reproduces a machine approximately.
#
# gitleaks is load-bearing, not incidental: .githooks/pre-commit hard-fails
# without it. Removing it from this list silently disables secret scanning on
# the next fresh machine.
